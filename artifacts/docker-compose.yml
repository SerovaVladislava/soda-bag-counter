name: rtsp-bag-counter

# Имена контейнеров намеренно не заданы через container_name: такие имена
# глобальны для всего Docker, и любой оставшийся от прошлой установки контейнер
# блокирует запуск. Без них Compose именует контейнеры по проекту
# (rtsp-bag-counter-backend-1), поэтому конфликт невозможен.

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  backend:
    image: rtsp-file-stream-tester-backend:latest
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "18000:8000"
    volumes:
      - ./data/uploads:/app/uploads
