name: rtsp-bag-counter

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  backend:
    image: rtsp-file-stream-tester-backend:latest
    container_name: rtsp-backend
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "18000:8000"
    volumes:
      - ./data/uploads:/app/uploads
