# Быстрая доставка правок без перезаливки образа.
#
# Compose подхватывает этот файл автоматически, если он лежит рядом с
# docker-compose.yml. Он подменяет файлы внутри контейнера свежими версиями
# с диска — образ пересобирать не нужно.
#
# Как применить:
#   1. Положите рядом с docker-compose.yml этот файл и analytics.py
#   2. docker compose up -d
#
# Строка с main.py закомментирована: правки в нём касаются публикации
# загруженного видеофайла и не нужны, когда источник — реальная камера.
# Если понадобится, скачайте backend/app/main.py и снимите комментарий.
#
# Как откатиться: удалите этот файл и подменяемые файлы, затем
# docker compose up -d

services:
  backend:
    volumes:
      - ./data/uploads:/app/uploads
      - ./analytics.py:/app/app/analytics.py:ro
      # - ./main.py:/app/app/main.py:ro
